name: Terraform

on:
  workflow_call:
    inputs:
      terraform-version:
        description: Terraform version to use
        type: string
        default: latest
      working-directory:
        description: Directory containing Terraform files
        type: string
        default: .

jobs:
  docs:
    name: Docs (terraform-docs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
      - uses: terraform-docs/gh-actions@6de6da0cefcc6b4b7a5cbea4d79d97060733093c # v1.4.1
        with:
          working-dir: ${{ inputs.working-directory }}
          output-file: README.md
          output-method: inject
          git-push: true

  fmt:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4
        with:
          terraform_version: ${{ inputs.terraform-version }}
      - name: terraform fmt
        run: terraform fmt -check -recursive
        working-directory: ${{ inputs.working-directory }}

  security:
    name: Security (tfsec)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aquasecurity/tfsec-sarif-action@21ded20e8ca120cd9d3d6ab04ef746477542a608 # v0.1.4
        with:
          sarif_file: tfsec.sarif
          working_directory: ${{ inputs.working-directory }}
      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: tfsec.sarif
          category: tfsec
