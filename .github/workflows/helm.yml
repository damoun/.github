name: Helm

on:
  workflow_call:
    inputs:
      charts_dir:
        description: Path to the charts directory
        type: string
        default: charts
      helm_version:
        description: Helm version to use
        type: string
        default: v3.17.0

jobs:
  lint:
    name: Lint & Validate
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ inputs.helm_version }}
      - name: Helm lint
        run: helm lint ${{ inputs.charts_dir }}/*
      - name: Helm template (validate)
        run: |
          for chart in ${{ inputs.charts_dir }}/*/; do
            helm template release "$chart" > /dev/null
          done

  trivy:
    name: Trivy scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ inputs.helm_version }}
      - name: Package charts
        run: |
          mkdir -p /tmp/charts
          for chart in ${{ inputs.charts_dir }}/*/; do
            helm package "$chart" -d /tmp/charts
          done
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: /tmp/charts
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy.sarif
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy.sarif
          category: trivy-helm
